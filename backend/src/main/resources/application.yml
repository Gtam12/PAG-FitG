spring:
  application:
    name: fitg-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fitg}
    username: ${DB_USER:fitg}
    password: ${DB_PASSWORD:fitg}

  jpa:
    open-in-view: false          # never lazy-load in controllers
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  docker:
    compose:
      lifecycle-management: start-only   # boots ./compose.yaml on app start, leaves it running

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

fitg:
  jwt:
    # 256-bit+ secret, base64. Generate: openssl rand -base64 32
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-00=}
    ttl: 7d
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}   # ngrok/cloudflared URL when testing Strava webhooks
  mobile-redirect-scheme: fitg                                 # deep link back into the app
  strava:
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    webhook-verify-token: ${STRAVA_WEBHOOK_VERIFY_TOKEN:}
    scopes: read,activity:read_all
